x-env-values:
  # Fill these once here. They are reused for both build-time and runtime envs.
  host_port: &host_port "3001"
  medusa_backend_url: &medusa_backend_url "https://api.notionworxcanopy.com"
  medusa_api_key: &medusa_api_key "pk_a3e8c2ab278dc946329ea2ba8f041be114e2623af87e9d720e88fa9ea0953567"
  medusa_admin_api_key: &medusa_admin_api_key "sk_e75d465d4f7ed8e313698e02f6b8bb2a826bc5e85d308e9d4736226af74ac398"
  next_public_supabase_url: &next_public_supabase_url ""
  next_public_supabase_anon_key: &next_public_supabase_anon_key ""
  azure_openai_image_endpoint: &azure_openai_image_endpoint ""
  azure_openai_image_key: &azure_openai_image_key ""
  azure_openai_base_url: &azure_openai_base_url ""
  azure_openai_responses_endpoint: &azure_openai_responses_endpoint ""
  azure_openai_api_key: &azure_openai_api_key ""
  azure_openai_model: &azure_openai_model ""
  resend_api_key: &resend_api_key ""

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: *next_public_supabase_url
        NEXT_PUBLIC_SUPABASE_ANON_KEY: *next_public_supabase_anon_key
    image: notionworx-nx:stage
    container_name: notionworx-nx
    restart: unless-stopped
    ports:
      - target: 3000
        published: *host_port
        protocol: tcp
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MEDUSA_BACKEND_URL: *medusa_backend_url
      MEDUSA_API_KEY: *medusa_api_key
      MEDUSA_ADMIN_API_KEY: *medusa_admin_api_key
      NEXT_PUBLIC_SUPABASE_URL: *next_public_supabase_url
      NEXT_PUBLIC_SUPABASE_ANON_KEY: *next_public_supabase_anon_key
      AZURE_OPENAI_IMAGE_ENDPOINT: *azure_openai_image_endpoint
      AZURE_OPENAI_IMAGE_KEY: *azure_openai_image_key
      AZURE_OPENAI_BASE_URL: *azure_openai_base_url
      AZURE_OPENAI_RESPONSES_ENDPOINT: *azure_openai_responses_endpoint
      AZURE_OPENAI_API_KEY: *azure_openai_api_key
      AZURE_OPENAI_MODEL: *azure_openai_model
      RESEND_API_KEY: *resend_api_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
